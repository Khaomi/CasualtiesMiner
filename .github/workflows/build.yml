name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore -r ${{ matrix.rid }}

      - name: Build
        run: dotnet publish -c Release -r ${{ matrix.rid }}

      - name: Upload CasualtiesMiner.Cli
        uses: actions/upload-artifact@v4
        with:
          name: CasualtiesMiner.Cli-${{ matrix.os }}
          path: |
            CasualtiesMiner.Cli/bin/Release/net10.0/${{ matrix.rid }}/native/
