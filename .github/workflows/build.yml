name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet publish --no-restore -c Release

      - name: Upload CasualtiesMiner.Cli
        uses: actions/upload-artifact@v4
        with:
          name: CasualtiesMiner.Cli-${{ matrix.os }}
          path: |
            CasualtiesMiner.Cli/bin/Release/**/**/publish/**/*
